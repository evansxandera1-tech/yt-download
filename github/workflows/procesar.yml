
name: Procesar canal de YouTube

on:
  workflow_dispatch:
    inputs:
      canal:
        description: "Link/@usuario del canal, o link directo de un video"
        required: true
        type: string
      max_videos:
        description: "Cuántos videos nuevos procesar"
        required: false
        default: "1"
        type: string

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Procesar canal
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE
